name: Tap Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  audit:
    timeout-minutes: 15
    name: Validate Formulae Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Ruby syntax of Formulae
        run: |
          for f in Formula/*.rb; do
            [ -f "$f" ] || continue
            ruby -c "$f"
          done
