name: Tap Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    timeout-minutes: 15
    name: Validate Formulae Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Ruby syntax of Formulae
        run: |
          for f in Formula/*.rb; do
            [ -f "$f" ] || continue
            ruby -c "$f"
          done

  test:
    timeout-minutes: 30
    name: Test Formulae
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Homebrew refuses to install formula files outside a tap, so register
      # this checkout as the seankoji-com/tap tap and install by tap name.
      - name: Tap this checkout
        run: |
          tap_dir="$(brew --repository)/Library/Taps/seankoji-com/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          rm -rf "$tap_dir"
          cp -R "$GITHUB_WORKSPACE" "$tap_dir"

      - name: Test formulae
        run: |
          for f in Formula/*.rb; do
            [ -f "$f" ] || continue
            formula_name=$(basename "$f" .rb)
            echo "Testing formula: $formula_name"
            brew install --formula "seankoji-com/tap/$formula_name" || {
              echo "Failed to install $formula_name"
              exit 1
            }
            brew test "seankoji-com/tap/$formula_name" || {
              echo "brew test failed for $formula_name"
              exit 1
            }
          done
